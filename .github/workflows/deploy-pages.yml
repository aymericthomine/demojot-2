name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/procedural-video-generator-uvyody, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the static site
        # NEXT_PUBLIC_STATIC_BUILD drops the render API from the build; the app
        # shows the CLI command instead. PAGES_BASE_PATH matches the project
        # site sub-path, so assets resolve under /demojot-2/.
        run: npm run build:static

      - name: Stop Jekyll from swallowing the _next folder
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
